version: "3.8"

networks:
  dendrite-mesh:
    driver: bridge

volumes:
  linear-postgres-data:

services:
  linear-postgres:
    image: postgres:16-alpine
    container_name: dendrite-linear-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: linear_dev
      POSTGRES_USER: linear_user
      POSTGRES_PASSWORD: linear_password
    ports:
      - "5433:5432"
    volumes:
      - linear-postgres-data:/var/lib/postgresql/data
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linear_user -d linear_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  linear-server:
    image: ghcr.io/dendrite-dev/linear-mock:latest
    container_name: dendrite-linear-server
    restart: unless-stopped
    depends_on:
      linear-postgres:
        condition: service_healthy
    environment:
      PORT: 8085
      DATABASE_URL: "postgres://linear_user:linear_password@linear-postgres:5432/linear_dev?sslmode=disable"
      LINEAR_API_KEY: "lin_local_mock_key_dendrite"
      LINEAR_EMULATOR_MODE: "true"
      LOG_LEVEL: "info"
    ports:
      - "8085:8085"
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
