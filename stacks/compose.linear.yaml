version: "3.8"

networks:
  dendrite-mesh:
    driver: bridge

volumes:
  linear-postgres-data:

services:
  linear-postgres:
    image: postgres:16-alpine
    container_name: dendrite-linear-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LINEAR_DB_NAME:-linear_dev}
      POSTGRES_USER: ${LINEAR_DB_USER:-linear_user}
      POSTGRES_PASSWORD: ${LINEAR_DB_PASSWORD:-linear_password}
    ports:
      - "${LINEAR_DB_PORT:-5433}:5432"
    volumes:
      - linear-postgres-data:/var/lib/postgresql/data
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LINEAR_DB_USER:-linear_user} -d ${LINEAR_DB_NAME:-linear_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5

  linear-server:
    image: ghcr.io/dendrite-dev/linear-mock:latest
    container_name: dendrite-linear-server
    restart: unless-stopped
    depends_on:
      linear-postgres:
        condition: service_healthy
    environment:
      PORT: ${LINEAR_PORT:-8085}
      DATABASE_URL: "postgres://${LINEAR_DB_USER:-linear_user}:${LINEAR_DB_PASSWORD:-linear_password}@linear-postgres:5432/${LINEAR_DB_NAME:-linear_dev}?sslmode=disable"
      LINEAR_API_KEY: "${LINEAR_API_KEY:-lin_local_mock_key_dendrite}"
      LINEAR_EMULATOR_MODE: "${LINEAR_EMULATOR_MODE:-true}"
      LOG_LEVEL: "info"
    ports:
      - "${LINEAR_PORT:-8085}:${LINEAR_PORT:-8085}"
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${LINEAR_PORT:-8085}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
