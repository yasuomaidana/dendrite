version: "3.8"

networks:
  dendrite-mesh:
    driver: bridge

volumes:
  penpot-postgres-data:
  penpot-redis-data:
  penpot-assets:

services:
  penpot-postgres:
    image: postgres:16-alpine
    container_name: dendrite-penpot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PENPOT_DB_NAME:-penpot_dev}
      POSTGRES_USER: ${PENPOT_DB_USER:-penpot_user}
      POSTGRES_PASSWORD: ${PENPOT_DB_PASSWORD:-penpot_password}
    ports:
      - "${PENPOT_DB_PORT:-5435}:5432"
    volumes:
      - penpot-postgres-data:/var/lib/postgresql/data
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PENPOT_DB_USER:-penpot_user} -d ${PENPOT_DB_NAME:-penpot_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5

  penpot-redis:
    image: redis:7-alpine
    container_name: dendrite-penpot-redis
    restart: unless-stopped
    ports:
      - "${PENPOT_REDIS_PORT:-6381}:6379"
    volumes:
      - penpot-redis-data:/data
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  penpot-backend:
    image: penpotapp/backend:latest
    container_name: dendrite-penpot-backend
    restart: unless-stopped
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-redis:
        condition: service_healthy
    environment:
      PENPOT_FLAGS: "enable-prepl-server disable-email-verification disable-secure-session-cookies"
      PENPOT_DATABASE_URI: "postgresql://penpot-postgres:5432/${PENPOT_DB_NAME:-penpot_dev}"
      PENPOT_DATABASE_USERNAME: "${PENPOT_DB_USER:-penpot_user}"
      PENPOT_DATABASE_PASSWORD: "${PENPOT_DB_PASSWORD:-penpot_password}"
      PENPOT_REDIS_URI: "redis://penpot-redis:6379/0"
      PENPOT_SECRET_KEY: "${PENPOT_SECRET_KEY:-dendrite_penpot_secret_key_mock_local}"
      PENPOT_PUBLIC_URI: "http://localhost:${PENPOT_FRONTEND_PORT:-9000}"
    ports:
      - "${PENPOT_BACKEND_PORT:-9001}:6060"
    volumes:
      - penpot-assets:/opt/data/assets
    networks:
      - dendrite-mesh

  penpot-frontend:
    image: penpotapp/frontend:latest
    container_name: dendrite-penpot-frontend
    restart: unless-stopped
    depends_on:
      - penpot-backend
    environment:
      PENPOT_FLAGS: "enable-prepl-server disable-email-verification disable-secure-session-cookies"
      PENPOT_PUBLIC_URI: "http://localhost:${PENPOT_FRONTEND_PORT:-9000}"
      PENPOT_BACKEND_URI: "http://penpot-backend:6060"
      PENPOT_EXPORTER_URI: "http://penpot-backend:6060"
    ports:
      - "${PENPOT_FRONTEND_PORT:-9000}:8080"
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 3
