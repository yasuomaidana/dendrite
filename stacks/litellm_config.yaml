model_list:
    - model_name: gemini-4-argon-medium
      litellm_params:
        model: gemini/gemini-4-argon-medium
        api_key: os.environ/GEMINI_API_KEY
        max_tokens: 8192
      model_info:
        id: gemini-4-argon-medium
        mode: chat
        input_cost_per_token: 1.25e-06
        output_cost_per_token: 5e-06
        max_input_tokens: 1048576
        max_output_tokens: 8192
        base_model: gemini/gemini-4-argon-medium
    - model_name: copilot-sonnet
      litellm_params:
        model: github_copilot/claude-sonnet-4.6
        api_key: os.environ/COPILOT_API_KEY
        max_tokens: 8192
        drop_params: true
        extra_headers:
            Copilot-Integration-Id: vscode-chat
            Editor-Version: vscode/1.95.0
      model_info:
        id: copilot-sonnet
        mode: chat
        input_cost_per_token: 3e-06
        output_cost_per_token: 1.5e-05
        max_input_tokens: 200000
        max_output_tokens: 8192
        base_model: claude-sonnet-4.6
