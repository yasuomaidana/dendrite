model_list:
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 8192
    model_info:
      id: gemini-2.5-pro
      mode: chat
      input_cost_per_token: 1.25e-06
      output_cost_per_token: 5e-06
      max_input_tokens: 1048576
      max_output_tokens: 8192
      base_model: gemini/gemini-2.5-pro
  - model_name: copilot-sonnet
    litellm_params:
      model: github_copilot/claude-sonnet-4.5
      api_key: os.environ/COPILOT_API_KEY
      drop_params: true
      extra_headers:
        Copilot-Integration-Id: vscode-chat
        Editor-Version: vscode/1.95.0
      max_tokens: 8192
    model_info:
      id: copilot-sonnet
      mode: chat
      input_cost_per_token: 3e-06
      output_cost_per_token: 1.5e-05
      max_input_tokens: 200000
      max_output_tokens: 8192
      base_model: claude-sonnet-4.5
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 8192
    model_info:
      id: gemini-2.5-flash
      mode: chat
      input_cost_per_token: 7.5e-08
      output_cost_per_token: 3e-07
      max_input_tokens: 1048576
      max_output_tokens: 8192
      base_model: gemini/gemini-2.5-flash
  - model_name: local-qwen-coder
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://host.docker.internal:11434
      custom_llm_provider: ollama
      max_tokens: 4096
    model_info:
      id: local-qwen-coder
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0
      max_input_tokens: 32768
      max_output_tokens: 4096
      base_model: llama3.2:latest
      skip_budget_checks: true
  - model_name: local-llama3
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://host.docker.internal:11434
      custom_llm_provider: ollama
      max_tokens: 4096
    model_info:
      id: local-llama3
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0
      max_input_tokens: 32768
      max_output_tokens: 4096
      base_model: llama3.2:latest
      skip_budget_checks: true

router_settings:
  routing_strategy: usage-based-routing
  fallbacks:
    - gemini-2.5-pro:
        - copilot-sonnet
        - gemini-2.5-flash
        - local-qwen-coder
    - copilot-sonnet:
        - gemini-2.5-flash
        - local-qwen-coder
    - gemini-2.5-flash:
        - local-qwen-coder
  context_window_fallbacks:
    - local-qwen-coder: gemini-2.5-pro
    - gemini-2.5-flash: gemini-2.5-pro
  timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
  budget_duration: 7d
