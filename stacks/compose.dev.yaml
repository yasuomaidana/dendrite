version: "3.8"

networks:
  dendrite-mesh:
    driver: bridge

volumes:
  dendrite-postgres-data:
  dendrite-redis-data:
  linear-postgres-data:

services:
  # Core Database
  postgres:
    image: postgres:16-alpine
    container_name: dendrite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dendrite}
      POSTGRES_USER: ${POSTGRES_USER:-dendrite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dendrite_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dendrite-postgres-data:/var/lib/postgresql/data
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dendrite} -d ${POSTGRES_DB:-dendrite}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Core Cache
  redis:
    image: redis:7-alpine
    container_name: dendrite-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dendrite-redis-data:/data
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Token Governance Gateway
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: dendrite-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dendrite}:${POSTGRES_PASSWORD:-dendrite_password}@postgres:5432/${POSTGRES_DB:-dendrite}"
      STORE_MODEL_IN_DB: "${STORE_MODEL_IN_DB:-True}"
    networks:
      - dendrite-mesh
    depends_on:
      postgres:
        condition: service_healthy

  # Dedicated Linear Storage
  linear-postgres:
    image: postgres:16-alpine
    container_name: dendrite-linear-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LINEAR_DB_NAME:-linear_dev}
      POSTGRES_USER: ${LINEAR_DB_USER:-linear_user}
      POSTGRES_PASSWORD: ${LINEAR_DB_PASSWORD:-linear_password}
    ports:
      - "${LINEAR_DB_PORT:-5433}:5432"
    volumes:
      - linear-postgres-data:/var/lib/postgresql/data
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LINEAR_DB_USER:-linear_user} -d ${LINEAR_DB_NAME:-linear_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local Linear Container Server
  linear-server:
    image: ghcr.io/dendrite-dev/linear-mock:latest
    container_name: dendrite-linear-server
    restart: unless-stopped
    depends_on:
      linear-postgres:
        condition: service_healthy
    environment:
      PORT: ${LINEAR_PORT:-8085}
      DATABASE_URL: "postgres://${LINEAR_DB_USER:-linear_user}:${LINEAR_DB_PASSWORD:-linear_password}@linear-postgres:5432/${LINEAR_DB_NAME:-linear_dev}?sslmode=disable"
      LINEAR_API_KEY: "${LINEAR_API_KEY:-lin_local_mock_key_dendrite}"
      LINEAR_EMULATOR_MODE: "${LINEAR_EMULATOR_MODE:-true}"
      LOG_LEVEL: "info"
    ports:
      - "${LINEAR_PORT:-8085}:${LINEAR_PORT:-8085}"
    networks:
      - dendrite-mesh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${LINEAR_PORT:-8085}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
