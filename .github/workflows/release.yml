# Publishes a release when a vX.Y.Z tag is pushed. The assets are the ones `dendrite update` looks for
# (pkg/selfupdate: AssetName = dendrite_<goos>_<goarch>, plus <asset>.sha256 holding the SHA-256 digest).
name: Release

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: The tag matches the version in the binary
        run: |
          want="v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' cmd/dendrite/internal/cli/root.go)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match cli.Version ($want)" >&2
            exit 1
          fi

      - name: Siblings are referenced by release or main only
        run: bash scripts/check-release-refs.sh

      - name: Build the four targets
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            goos=${target%/*}; goarch=${target#*/}
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags '-s -w' -o "dist/dendrite_${goos}_${goarch}" ./cmd/dendrite
            (cd dist && shasum -a 256 "dendrite_${goos}_${goarch}" | awk '{print $1}' > "dendrite_${goos}_${goarch}.sha256")
          done
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          section=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          [ -n "$section" ] || { echo "CHANGELOG.md has no [${GITHUB_REF_NAME#v}] section" >&2; exit 1; }
          printf '%s\n' "$section" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Dendrite $GITHUB_REF_NAME" --notes-file notes.md
