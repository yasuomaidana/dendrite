# Second opinion on function complexity, using the standard tool of each language.
# Our own implementation (dendrite-core, run by `dendrite allostasis gate` and loom-gate) stays the first check; this
# workflow runs the language tools as an independent cross-check. Limits come from [complexity] in
# .github/dendrite/directives.toml (defaults: cyclomatic 10, cognitive 15).
name: complexity (second opinion)
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  go:
    name: Go (gocyclo, gocognit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Limits from the project directives
        id: limits
        run: |
          f=.github/dendrite/directives.toml
          pick() { awk -v key="$1" '/^\[complexity\]/{t=1;next} /^\[/{t=0} t && $1==key {print $3; exit}' "$f" 2>/dev/null || true; }
          cyc=$(pick max_cyclomatic); cog=$(pick max_cognitive)
          echo "cyc=${cyc:-10}" >> "$GITHUB_OUTPUT"
          echo "cog=${cog:-15}" >> "$GITHUB_OUTPUT"
      - name: Install gocyclo and gocognit
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go install github.com/uudashr/gocognit/cmd/gocognit@v1.1.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gocyclo (report only, known debt DEN-816)
        run: |
          out=$(gocyclo -over "${{ steps.limits.outputs.cyc }}" . 2>&1) && rc=0 || rc=$?
          if [ "$rc" -gt 1 ]; then printf '%s\n' "$out" | tail -20; echo "::error title=gocyclo::gocyclo did not run (exit $rc)"; exit 1; fi
          n=$(printf '%s\n' "$out" | grep -c . || true)
          echo "::warning title=gocyclo::$n findings above the cyclomatic limit (known debt, DEN-816); this step turns blocking when the debt is cleared"
          echo "gocyclo: $n findings above the cyclomatic limit" >> "$GITHUB_STEP_SUMMARY"
      - name: gocognit (report only, known debt DEN-816)
        run: |
          out=$(gocognit -over "${{ steps.limits.outputs.cog }}" . 2>&1) && rc=0 || rc=$?
          if [ "$rc" -gt 1 ]; then printf '%s\n' "$out" | tail -20; echo "::error title=gocognit::gocognit did not run (exit $rc)"; exit 1; fi
          n=$(printf '%s\n' "$out" | grep -c . || true)
          echo "::warning title=gocognit::$n findings above the cognitive limit (known debt, DEN-816); this step turns blocking when the debt is cleared"
          echo "gocognit: $n findings above the cognitive limit" >> "$GITHUB_STEP_SUMMARY"
  python:
    name: Python (ruff C901)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limits from the project directives
        id: limits
        run: |
          f=.github/dendrite/directives.toml
          pick() { awk -v key="$1" '/^\[complexity\]/{t=1;next} /^\[/{t=0} t && $1==key {print $3; exit}' "$f" 2>/dev/null || true; }
          cyc=$(pick max_cyclomatic); cog=$(pick max_cognitive)
          echo "cyc=${cyc:-10}" >> "$GITHUB_OUTPUT"
          echo "cog=${cog:-15}" >> "$GITHUB_OUTPUT"
      - name: ruff C901 (McCabe)
        run: |
          python3 -m pip install --quiet ruff==0.12.0
          ruff check --isolated --select C901 --config "lint.mccabe.max-complexity = ${{ steps.limits.outputs.cyc }}" scripts
