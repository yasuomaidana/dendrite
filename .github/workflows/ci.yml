name: Dendrite CI/CD

on:
  push:
    branches: [ develop, main, 'agent/den-407' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  verify:
    name: Test, Coverage Ratchet & Docs Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Dendrite's tests run against the real dendrite-plane sidecar (there is no Go stand-in for it), so the runner
      # builds it. planetest finds it through DENDRITE_PLANE_TEST_BIN. The sidecar is taken from the ref named by
      # DENDRITE_PLANE_REF (default: its develop branch).
      - name: Check out the dendrite-plane sidecar
        uses: actions/checkout@v4
        with:
          repository: yasuomaidana/dendrite-plane-rs
          ref: ${{ vars.DENDRITE_PLANE_REF || 'develop' }}
          path: .ci/dendrite-plane-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the sidecar build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/dendrite-plane-rs

      - name: Build the dendrite-plane sidecar
        run: |
          cargo build --release --manifest-path .ci/dendrite-plane-rs/Cargo.toml
          echo "DENDRITE_PLANE_TEST_BIN=$GITHUB_WORKSPACE/.ci/dendrite-plane-rs/target/release/dendrite-plane" >> "$GITHUB_ENV"

      - name: Run Tests (race detector)
        run: |
          go test -race ./...

      - name: Coverage Ratchet (no package may drop; goal 100%)
        run: |
          # Fails when any package falls below .github/coverage_baseline.json or a new package starts below 100%.
          go run ./cmd/dendrite allostasis coverage --ratchet

      - name: Verify Documentation Reference Audit (--strict)
        run: |
          go run ./cmd/dendrite codex audit --strict

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Bun Tests & Build
        run: |
          if [ -d "website" ]; then
            cd website && bun install --frozen-lockfile && bun run build
          else
            bun test
          fi

      - name: Set up uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify Python Environment with uv
        run: |
          uv --version
          if [ -f "scripts/pyproject.toml" ]; then
            cd scripts && uv pip list || true
          fi
