name: Dendrite CI/CD

on:
  push:
    branches: [ develop, main ]
  pull_request:

jobs:
  release-refs:
    name: release refs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Siblings are referenced by release or main only
        run: bash scripts/check-release-refs.sh

  verify:
    name: Test, Coverage Ratchet & Docs Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Dendrite's tests run against the real dendrite-plane sidecar (there is no Go stand-in for it), so the runner
      # builds it. planetest finds it through DENDRITE_PLANE_TEST_BIN. Each sidecar is taken from the release tag
      # named by its repository variable (DENDRITE_PLANE_REF, DENDRITE_RAG_REF; default: v0.1.0), so a release
      # builds against the sidecars it shipped with. scripts/check-release-refs.sh allows only main or a vX.Y.Z tag.
      - name: Check out the dendrite-plane sidecar
        uses: actions/checkout@v4
        with:
          repository: yasuomaidana/dendrite-plane-rs
          ref: ${{ vars.DENDRITE_PLANE_REF || 'v0.1.0' }}
          path: .ci/dendrite-plane-rs

      - name: Check out the dendrite-rag sidecar
        uses: actions/checkout@v4
        with:
          repository: yasuomaidana/dendrite-rag-rs
          ref: ${{ vars.DENDRITE_RAG_REF || 'v0.1.0' }}
          path: .ci/dendrite-rag-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the sidecar builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .ci/dendrite-plane-rs
            .ci/dendrite-rag-rs

      - name: Build the sidecars
        run: |
          cargo build --release --manifest-path .ci/dendrite-plane-rs/Cargo.toml
          cargo build --release --manifest-path .ci/dendrite-rag-rs/Cargo.toml -p dendrite-rag
          {
            echo "DENDRITE_PLANE_TEST_BIN=$GITHUB_WORKSPACE/.ci/dendrite-plane-rs/target/release/dendrite-plane"
            echo "DENDRITE_DENDRITE_PLANE_BIN=$GITHUB_WORKSPACE/.ci/dendrite-plane-rs/target/release/dendrite-plane"
            echo "DENDRITE_DENDRITE_RAG_BIN=$GITHUB_WORKSPACE/.ci/dendrite-rag-rs/target/release/dendrite-rag"
          } >> "$GITHUB_ENV"

      - name: Run Tests (race detector)
        run: |
          go test -race ./...

      - name: Coverage Ratchet (no package may drop; goal 100%)
        run: |
          # Fails when any package falls below .github/coverage_baseline.json or a new package starts below 100%.
          go run ./cmd/dendrite allostasis coverage --ratchet

      - name: Verify Documentation Reference Audit (--strict)
        run: |
          go run ./cmd/dendrite codex audit --strict

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # exact, so the build does not change under us; raise it deliberately

      - name: Run Bun Tests & Build
        run: |
          if [ -d "website" ]; then
            # website/docs is generated (git-ignored) from the canonical docs/
            go run ./cmd/dendrite codex generate --docs docs --out website
            cd website && bun install --frozen-lockfile && bun run build
          else
            bun test
          fi

      - name: Set up uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify Python Environment with uv
        run: |
          uv --version
          if [ -f "scripts/pyproject.toml" ]; then
            cd scripts && uv pip list || true
          fi
