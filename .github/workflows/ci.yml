name: Dendrite CI/CD

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  verify:
    name: Test, Coverage Ratchet & Docs Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run Tests (race detector)
        run: |
          go test -race ./...

      - name: Coverage Ratchet (no package may drop; goal 100%)
        run: |
          # Fails when any package falls below .dendrite/coverage_baseline.json or a new package starts below 100%.
          go run ./cmd/dendrite quality coverage --ratchet

      - name: Verify Documentation Reference Audit (--strict)
        run: |
          go run ./cmd/dendrite docs audit --strict

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Bun Tests & Build
        run: |
          if [ -d "website" ]; then
            cd website && bun install --frozen-lockfile && bun run build
          else
            bun test
          fi

      - name: Set up uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify Python Environment with uv
        run: |
          uv --version
          if [ -f "scripts/pyproject.toml" ]; then
            cd scripts && uv pip list || true
          fi
